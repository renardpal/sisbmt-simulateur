<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulateur budgétaire – SISBMT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="row1">
      <h1>Simulateur budgétaire SISBMT<small>Syndicat intercommunal d'intérêt scolaire – siège : Thizy (89)</small></h1>
      <div class="tools">
        <input type="text" id="scenName" title="Nom du scénario" placeholder="Nom du scénario">
        <button class="btn ghost" data-act="saveScen" title="Enregistrer dans ce navigateur">Enregistrer</button>
        <select id="scenList" title="Scénarios enregistrés"></select>
        <button class="btn ghost" data-act="exportJson" title="Télécharger le scénario (.json)">Exporter</button>
        <button class="btn ghost" data-act="importJson" title="Ouvrir un scénario (.json)">Importer</button>
        <button class="btn ghost" data-act="exportCsv" title="Tableaux pour Excel (.csv)">CSV</button>
        <button class="btn ghost" data-act="print">Imprimer</button>
        <button class="btn ghost" data-act="reset" title="Revenir aux données du budget 2026">Réinitialiser</button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
  <footer>Simulation indicative – les montants ne remplacent pas le budget voté. Données enregistrées uniquement dans votre navigateur.</footer>

  <script src="js/data.js"></script>
  <script src="js/model.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
